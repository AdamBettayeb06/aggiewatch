name: AggieWatch

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum; runs can be a few min late)
  workflow_dispatch:         # lets you click "Run workflow" to test

permissions:
  contents: write            # needed to save state.json back to the repo

concurrency:
  group: aggiewatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check seats
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python aggiewatch.py --once

      - name: Save state (only if something changed)
        run: |
          git config user.name "aggiewatch-bot"
          git config user.email "aggiewatch-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update seat state" && git push)
